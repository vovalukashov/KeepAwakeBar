name: KeepAwakeBar
options:
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.local.KeepAwakeBar
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  KeepAwakeBar:
    type: application
    platform: macOS
    sources:
      - path: KeepAwakeBar
        excludes: [Info.plist]
    dependencies:
      - target: KeepAwakeBarHelper
        embed: false
    postBuildScripts:
      - name: Embed session helper
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          cp "$BUILT_PRODUCTS_DIR/KeepAwakeBarHelper" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/KeepAwakeBarHelper"
        inputFiles: ["$(BUILT_PRODUCTS_DIR)/KeepAwakeBarHelper"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/KeepAwakeBarHelper"]
    info:
      path: KeepAwakeBar/Info.plist
      properties:
        CFBundleDisplayName: KeepAwakeBar
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "6"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 KeepAwakeBar"
  KeepAwakeBarHelper:
    type: tool
    platform: macOS
    sources: [Helper]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.local.KeepAwakeBar.Helper
schemes:
  KeepAwakeBar:
    build:
      targets:
        KeepAwakeBar: all
    run:
      config: Debug
